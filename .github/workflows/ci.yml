name: Loyalty Platform CI/CD Pipeline

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Lint, Typecheck & Integration Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run type-check

      - name: Run Deep Automated Tests (Vitest)
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/loyalty_test
          JWT_ACCESS_SECRET: test_ci_super_secret_access_jwt_key
          JWT_REFRESH_SECRET: test_ci_super_secret_refresh_jwt_key
        run: npm test

      - name: Production Build Compilation
        run: npm run build
